# app-hub, always-on. The same three services that run on EKS, run on one host.
#
# GUIDED BUILD (CLAUDE.md section 2). Docker Compose is new here, so Claude
# wrote this heavily commented and the owner runs every command.
#
# ===========================================================================
# THIS IS A SECOND DEPLOYMENT TARGET, NOT A REPLACEMENT.
#
#   infra/ + manifests/   EKS. Created and destroyed per session. The learning
#                         vehicle: Terraform, Kubernetes, observability, CI/CD.
#   compose/ (here)       One host, always on. The dashboard actually used.
#
# They must not converge. The EKS path is never simplified to save money, and
# this path never acquires Kubernetes. What they DO share is the image: the
# same registry, the same tag, the same bytes. If that ever stops being true,
# "it works on EKS" stops implying anything about here.
# ===========================================================================

services:

  # --------------------------------------------------------------------------
  # links-service -- the catalogue. Internal only.
  # --------------------------------------------------------------------------
  links-service:
    image: ${ECR_HOST}/app-hub/links-service:${LINKS_SERVICE_TAG}
    container_name: app-hub-links-service
    # NO `ports:` BLOCK, ON PURPOSE, AND THIS IS THE WHOLE SHAPE OF THE FILE.
    #
    # `ports:` publishes to the HOST's interfaces. Nothing here needs that --
    # gateway reaches these over the Compose network by service name, and the
    # outside world reaches gateway through the tunnel. Publishing a port would
    # put the catalogue API on the host's network for no reason.
    #
    # It mirrors what E-06 established on EKS: gateway public, the other two
    # ClusterIP. Same architecture, different mechanism.
    environment:
      # Presence of this switches build_repository() from the in-memory dict to
      # DynamoDB. Same table the EKS deployment writes to -- see README for why
      # a shared table rather than something local.
      LINKS_TABLE_NAME: ${LINKS_TABLE_NAME:-app-hub-links}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      # THERE IS NO IRSA OUTSIDE EKS. On the cluster a pod gets a short-lived,
      # automatically-rotated identity with no stored secret. Here it is a real
      # long-lived key on disk, which is exactly what learn/29 adopted IRSA to
      # avoid. Scoped to four DynamoDB actions on one table -- see README.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    # `unless-stopped`, not the default `no`. On 2026-09-13 the n8n container
    # was found Exited(137) and had needed a manual start -- its restart policy
    # was `no`, and a watchdog whose container is not running cannot warn you
    # about anything. An always-on service must come back by itself, including
    # after a host reboot.
    restart: unless-stopped
    healthcheck:
      # The image runs read-only with no shell utilities guaranteed, so this
      # uses python rather than curl -- which is present by definition.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------------------------
  # aggregator -- liveness probes. Internal only, and deliberately so.
  # --------------------------------------------------------------------------
  aggregator:
    image: ${ECR_HOST}/app-hub/aggregator:${AGGREGATOR_TAG}
    container_name: app-hub-aggregator
    environment:
      # PORT 8000, NOT 80, AND THIS IS THE TRAP WORTH READING TWICE.
      #
      # On EKS this value is http://links-service:80, because the Kubernetes
      # Service maps 80 -> 8000. Compose has no Service object: the name
      # resolves straight to the container, which listens on 8000.
      #
      # So the SAME variable needs a DIFFERENT value per target. That is worse
      # than a variable that is merely unset, and it is the third costume of a
      # bug this project has already paid for twice -- the 8000-vs-80 mix-up on
      # 2026-09-10, and AGGREGATOR_URL missing entirely (D-21) on 2026-09-13.
      LINKS_SERVICE_URL: http://links-service:8000
    restart: unless-stopped
    depends_on:
      links-service:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # gateway -- the dashboard and the only thing the tunnel talks to.
  # --------------------------------------------------------------------------
  gateway:
    image: ${ECR_HOST}/app-hub/gateway:${GATEWAY_TAG}
    container_name: app-hub-gateway
    environment:
      LINKS_SERVICE_URL: http://links-service:8000
      # 8002 both here and on EKS, because aggregator's Service happens to map
      # 8002 -> 8002. Do NOT "fix" this to match the line above out of
      # symmetry -- the numbers differ for a reason, and that reason is the
      # Service definition, not a convention.
      AGGREGATOR_URL: http://aggregator:8002

    # ------------------------------------------------------------------------
    # THE ONE PUBLISHED PORT IN THIS FILE, AND THE `127.0.0.1:` PREFIX IS THE
    # WHOLE POINT. Added 2026-09-25.
    #
    # WHY IT EXISTS: the host running these containers is NOT automatically a
    # member of the tailnet. The Tailscale node lives INSIDE the tailscale
    # container; the host never joins. So with tailnet-only serving and no
    # Tailscale client installed, the machine actually running the dashboard
    # was the one machine that could not open it. Measured, not assumed: the
    # tailnet had exactly one device -- the container itself.
    #
    # `127.0.0.1:8001:8001` binds to LOOPBACK ONLY. Nothing on the LAN, the
    # office network or a coffee-shop wifi can reach it; only a process on this
    # host can. Verify rather than trust the comment:
    #
    #   docker compose ps          -> must show 127.0.0.1:8001->8001/tcp
    #   netstat -ano | grep 8001   -> must NOT show 0.0.0.0:8001
    #
    # THIS IS NOT A HOLE IN THE "NO PUBLISHED PORTS" RULE, and the distinction
    # matters. That rule was written against the standalone n8n container,
    # which published 5678 on 0.0.0.0 -- an automation admin UI holding every
    # credential on the instance, reachable from anything on the network. The
    # difference between `0.0.0.0:` and `127.0.0.1:` is the difference between
    # "everyone nearby" and "this machine". n8n still publishes nothing.
    #
    # It also does NOT replace Tailscale. This gets you the dashboard at the
    # desk; the tailnet route is what gets you it from a phone or away from
    # home. Install the client and both work.
    # ------------------------------------------------------------------------
    ports:
      - "127.0.0.1:8001:8001"

    restart: unless-stopped
    depends_on:
      links-service:
        condition: service_healthy
      aggregator:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------------------------
  # n8n -- the automation instance. N-06, RE-TARGETED 2026-09-20.
  #
  # N-06 originally read "move n8n onto the EKS cluster", decided 2026-08-30.
  # That decision predated this host existing, and three things make EKS the
  # wrong home now:
  #
  #   1. It would need a Postgres that survives the nightly destroy -- an RDS
  #      billing permanently, which breaks the $0 resting state that
  #      FINISH-LINE.md's O10 now makes a criterion.
  #   2. It would put the COST WATCHDOG on the very cluster it watches. Every
  #      `make down` would destroy the thing whose job is to tell you the
  #      cluster is still running.
  #   3. It would need N8N_ENCRYPTION_KEY handed over as a Kubernetes Secret.
  #      Here that problem simply does not exist -- see the volume note below.
  #
  # This host is always on, costs nothing extra, and already runs n8n today as
  # a standalone `docker run`. Bringing it under Compose is the whole change.
  # --------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    environment:
      # BOTH, AND NOT NEGOTIABLE. D-22: the watchdog could never fire because
      # the container ran UTC while the Schedule Trigger was written in IST,
      # so "17:00" meant 22:30 local and nothing ever happened at the intended
      # hour. Setting only one of these is not enough.
      TZ: ${N8N_TZ:-Asia/Kolkata}
      GENERIC_TIMEZONE: ${N8N_TZ:-Asia/Kolkata}
    volumes:
      # ======================================================================
      # THE SINGLE MOST DANGEROUS LINE IN THIS FILE.
      #
      # `n8n_data` is declared EXTERNAL at the bottom, which makes Compose
      # attach the volume that ALREADY EXISTS rather than creating one.
      #
      # Without `external: true`, Compose would create a NEW, EMPTY volume
      # named `compose_n8n_data`. n8n would start, find no config, generate a
      # FRESH ENCRYPTION KEY -- and every stored credential in the old volume
      # becomes permanently undecryptable. The workflows would still be there
      # and every credential inside them would be rubble.
      #
      # Verified 2026-09-20: the live volume holds `config` (which carries
      # encryptionKey), `database.sqlite`, `nodes/` and `storage/`. That is why
      # this re-targeting needs no Secret handling at all -- the key travels
      # with the volume and is never typed, printed, or passed to anything.
      #
      # N-05 exists because this class of loss was foreseen. Do not "clean up"
      # this line.
      # ======================================================================
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    # NO `ports:` BLOCK, DELIBERATELY -- AND THIS IS A SECURITY IMPROVEMENT.
    #
    # The standalone container this replaces published 5678 on 0.0.0.0, so the
    # automation admin UI -- which holds every credential -- was reachable from
    # anything on the network. Under Compose it is reachable only through the
    # tailscale container, and only over the tailnet. See tailscale-serve.json.

  # --------------------------------------------------------------------------
  # tailscale -- the way in, without opening anything.
  #
  # CHOSEN OVER CLOUDFLARE TUNNEL on 2026-09-18, and the deciding factor was the
  # hostname, not the technology.
  #
  # A Cloudflare Tunnel's public hostname must live on a DOMAIN IN YOUR
  # CLOUDFLARE ACCOUNT. This project owns no domain -- manifests/ingress/README.md
  # has been waiting on one for its ACM certificate too -- and Cloudflare has no
  # free equivalent of the *.pages.dev name that Pages hands out. The free
  # option there is a Quick Tunnel, whose URL CHANGES ON EVERY RESTART, which is
  # useless for the one thing this host exists to be: a bookmark.
  #
  # Tailscale gives a stable HTTPS hostname on the free Personal plan with no
  # domain purchase:  https://<TS_HOSTNAME>.<your-tailnet>.ts.net
  # --------------------------------------------------------------------------
  tailscale:
    # `stable` rather than an exact version, and this is the ONLY floating tag
    # in the project. Same reasoning the cloudflared entry used before it: this
    # is a CLIENT to a service someone else operates, and an old client
    # eventually stops being accepted -- pinning it would create a breakage with
    # no local cause. The three app-hub images are pinned to exact git SHAs,
    # because those are ours and reproducibility is the point.
    image: tailscale/tailscale:stable
    container_name: app-hub-tailscale
    environment:
      # ONE-TIME credential, from the admin console. After the first successful
      # login the node identity lives in the state volume below and this can be
      # left empty -- tailscaled will not ask again. It is needed a second time
      # only if that volume is destroyed.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # THIS BECOMES THE URL.  app-hub -> https://app-hub.<tailnet>.ts.net
      TS_HOSTNAME: ${TS_HOSTNAME:-app-hub}
      # Where the node identity is kept. Points into the named volume below.
      TS_STATE_DIR: /var/lib/tailscale
      # The declarative serve/funnel config. Without this you would have to run
      # `tailscale funnel` by hand after every recreate -- precisely the kind of
      # manual step that works the first time and is forgotten the second.
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun device, no NET_ADMIN capability,
      # no privileged container. It works here because the serve/funnel proxy
      # runs INSIDE tailscaled, so reaching gateway is an ordinary connection on
      # the Compose network. Kernel mode is only needed to act as a subnet
      # router or an exit node, and this is neither.
      TS_USERSPACE: "true"
    volumes:
      # THE ONLY VOLUME IN THIS FILE, AND LOSING IT CHANGES YOUR URL.
      #
      # The node identity lives here. Destroy this volume and the container
      # re-registers as a NEW node -- and because the old `app-hub` node still
      # exists in the tailnet, Tailscale DOES NOT REUSE THE NAME. It appends a
      # suffix. The URL silently becomes https://app-hub-1.<tailnet>.ts.net and
      # every bookmark you made breaks, with nothing reporting an error.
      #
      # `docker compose down -v` is the command that does this. Plain
      # `docker compose down` does not.
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      # n8n has no healthcheck here, so service_started: the tailnet route to
      # it can come up slightly before n8n is answering, and a refresh fixes
      # that. Not worth a healthcheck that would delay the public dashboard.
      n8n:
        condition: service_started

volumes:
  tailscale-state:

  # EXTERNAL: attach the volume that already exists, never create one.
  # See the long note on the n8n service above -- getting this wrong makes
  # every stored n8n credential permanently undecryptable.
  n8n_data:
    external: true

# THE CONNECTION IS OUTBOUND, which is the whole point and is unchanged from
# the cloudflared design this replaced.
#
# tailscaled dials out to Tailscale and holds the connection open; traffic
# arrives back down it. So:
#   - no inbound port is opened on the host
#   - no port forwarding on the home router
#   - no dynamic DNS, no public IP needed
#   - a home firewall that blocks everything inbound stays exactly that way
#
# ===========================================================================
# FUNNEL IS PUBLIC, AND THE URL IS NOT A SECRET. Read this before trusting it.
#
# `AllowFunnel` in tailscale-serve.json is what exposes this to the open
# internet. Anyone who has the URL can load the dashboard. There is no login.
#
# And the URL is DISCOVERABLE. Funnel serves a real Let's Encrypt certificate,
# and every certificate issued is published to Certificate Transparency logs,
# which are public and searchable. Treat the hostname as known, not as hidden.
#
# That matters here specifically, because THE GATEWAY DASHBOARD DOES NOT FILTER
# ON THE `public` FLAG. That flag governs site/projects.json -- the public page
# on Cloudflare Pages -- and nothing else. The catalogue this dashboard renders
# comes straight from DynamoDB and currently includes entries marked private:
# `Notes`, `Acharya Amit Puri`, and a localhost URL.
#
# TO MAKE IT TAILNET-ONLY INSTEAD, which is arguably what a personal dashboard
# actually wants: set "AllowFunnel" to false in tailscale-serve.json. It is then
# reachable only from devices signed into your tailnet -- your phone, your
# laptop -- on the same stable HTTPS hostname, still free, still no domain.
#
# The public face of this project is ALREADY site/ on Cloudflare Pages. This
# host does not also have to be the portfolio piece.
# ===========================================================================
